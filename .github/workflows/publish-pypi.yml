name: Publish to PyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check package name and release version
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          name = project["name"]
          version = project["version"]
          tag = os.environ.get("RELEASE_TAG", "")

          if name != "pass-sim":
              raise SystemExit(f"Unexpected package name: {name}")
          if tag and tag != f"v{version}":
              raise SystemExit(
                  f"Version mismatch: tag={tag}, package={version}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")

          print(f"Building {name} {version}")

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build source distribution and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Save distribution files
        uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify installation
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distribution files
        uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Install the wheel
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found: {wheels}")

          subprocess.run(
              [sys.executable, "-m", "pip", "install", str(wheels[0])],
              check=True,
          )

      - name: Check dependencies
        run: python -m pip check

      - name: Check installed version and package data
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        shell: python
        run: |
          import os
          from importlib.metadata import version
          from importlib.resources import files

          import PASS

          expected = os.environ["EXPECTED_VERSION"]
          installed = version("pass-sim")
          if installed != expected or PASS.__version__ != expected:
              raise SystemExit(
                  f"Version mismatch: expected={expected}, "
                  f"metadata={installed}, module={PASS.__version__}"
              )

          resource = files("PASS.tool").joinpath("mass_catalog.json")
          if not resource.is_file():
              raise SystemExit("Missing package data: mass_catalog.json")

          print(f"Installed version: {installed}")
          print(f"Imported from: {PASS.__file__}")

      - name: Check command-line entry points
        run: |
          pass-run --version
          pass-run --help
          python -m PASS --help

  publish:
    name: Upload to PyPI
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: [build, verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pass-sim/
    permissions:
      id-token: write

    steps:
      - name: Download verified distribution files
        uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/

      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1